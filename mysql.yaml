---
- name: install mysql server on ubuntu
  hosts: all
  become: yes
  gather_facts: yes
  tasks:
    - name: install mysql server package
      ansible.builtin.package:
        name: mysql-server
        state: present

    - name: enable and start mysql service
      ansible.builtin.systemd:
        name: mysql
        enabled: yes
        state: started

    - name: debug mysql service started
      ansible.builtin.debug:
        msg: "enabled and started mysql service"
    - name: install mysql python package
      ansible.builtin.package:
        name: python3-mysql.connector
        state: present
    - name: debug mysql python package installed
      ansible.builtin.debug:
        msg: "installed mysql python package"
    - name: ensure mysql is listening on all interfaces
      ansible.builtin.lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: '^bind-address'
        line: 'bind-address = 0.0.0.0'
      notify:
        - restart mysql
  handlers:
    - name: restart mysql
      ansible.builtin.systemd:
        name: mysql
        state: restarted