---
- name: install nginx web server
  hosts: all
  become: yes
  tasks:
    - name: Install nginx package
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Ensure nginx service is running and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Copy custom nginx configuration file
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
      notify: Restart nginx

  handlers:
    - name: Restart nginx
      service:
        name: nginx
        state: restarted