---
- name: install tomcat and deploy sample app
  hosts: all
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install OpenJDK 11
      apt:
        name: openjdk-11-jdk
        state: present

    - name: Install Tomcat 9
      apt:
        name: tomcat9
        state: present

    - name: Start and enable Tomcat service
      systemd:
        name: tomcat9
        state: started
        enabled: yes

    - name: Deploy sample web application
      copy:
        src: /path/to/sample.war
        dest: /var/lib/tomcat9/webapps/sample.war
        owner: tomcat
        group: tomcat
        mode: '0644'

    - name: Restart Tomcat to deploy the application
      systemd:
        name: tomcat9
        state: restarted
      handler: Restart Tomcat
  handlers:
    - name: Restart Tomcat
      systemd:
        name: tomcat9
        state: restarted

    - name: Ensure firewall allows HTTP traffic
      ufw:
        rule: allow
        port: '80'
        proto: tcp
        state: enabled
    - name: Ensure firewall allows HTTPS traffic
      ufw:
        rule: allow
        port: '443'
        proto: tcp
        state: enabled
    - name: Ensure firewall allows Tomcat traffic
      ufw:
        rule: allow
        port: '8080'
        proto: tcp
        state: enabled    